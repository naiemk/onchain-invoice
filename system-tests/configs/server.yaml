port: 8080
baseUrl: ${BASE_URL}
db:
  path: ${DB_PATH}
adminApiKey: ${ADMIN_API_KEY}
sweeperApiKey: ${SWEEPER_API_KEY}
evm:
  rpcUrl: ${EVM_RPC_URL}
  sweeperAddress: ${SWEEPER_ADDRESS}
  forwarderImplementation: ${FORWARDER_IMPLEMENTATION}
cors:
  origins:
    - "*"
rateLimit:
  createPerSecond: 10
  publicPerIpPerSecond: 50
  sweeperPerIpPerSecond: 100
claimLeaseMs: 180000
