# System tests pull published GHCR images (no local product builds).
# Override tags with IMAGE_TAG (default: main).
# TLS/edge is host gateway on VPS (vibed-infra 0.8); this stack is api + ui + sweeper only.
name: trustless-commerce-system-tests

services:
  api:
    image: ghcr.io/naiemk/trustless-commerce-api:${IMAGE_TAG:-main}
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:18080}
      DB_PATH: /data/trustless-commerce.db
      ADMIN_API_KEY: ${ADMIN_API_KEY:-system-test-admin}
      SWEEPER_API_KEY: ${SWEEPER_API_KEY:-system-test-sweeper}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RATE_LIMIT_CREATE_PER_SECOND: ${RATE_LIMIT_CREATE_PER_SECOND:-10}
      SWEEPER_ADDRESS: ${SWEEPER_ADDRESS:-0x1111111111111111111111111111111111111111}
      FORWARDER_IMPLEMENTATION: ${FORWARDER_IMPLEMENTATION:-0x2222222222222222222222222222222222222222}
      EVM_RPC_URL: ${EVM_RPC_URL:-}
      # Sepolia passkey wallet (data/wallet-deploy-sepolia.json) for counterfactual smoke tests.
      WALLET_FACTORY_ADDRESS: ${WALLET_FACTORY_ADDRESS:-0x06964dE197ed29A4DC2D34F68aD4510Afa25f537}
      WALLET_RECOVERY_ADDRESS: ${WALLET_RECOVERY_ADDRESS:-0x72739889bcce2B08a23212bae6C7B9F1C29e7873}
      WALLET_IMPLEMENTATION_ADDRESS: ${WALLET_IMPLEMENTATION_ADDRESS:-0xe024cE8ed1878dBdd3ca8E73B1e586c4E46dC85C}
      WALLET_CHAIN_ID: ${WALLET_CHAIN_ID:-11155111}
      WALLET_BUNDLER_FEE_TOKEN: ${WALLET_BUNDLER_FEE_TOKEN:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
    volumes:
      - api-data:/data
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - internal

  ui:
    image: ghcr.io/naiemk/trustless-commerce-ui:${IMAGE_TAG:-main}
    ports:
      - "18081:80"
    networks:
      - internal

  sweeper:
    image: ghcr.io/naiemk/trustless-commerce-sweeper:${IMAGE_TAG:-main}
    environment:
      SERVER_URL: http://api:8080
      SWEEPER_CONFIG: /tmp/sweeper.yaml
      SWEEPER_WALLET_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      ACTIVITY_LOG_PATH: /tmp/activity.jsonl
    entrypoint: ["/bin/sh", "-c"]
    # Hardcoded throwaway Hardhat #0 key (public/well-known) for system tests only.
    command:
      - |
        cat > /tmp/sweeper.yaml <<'YAML'
        serverUrl: http://api:8080
        sweeperWalletKey: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
        apiKey: system-test-sweeper
        intervalMs: 2000
        maxRetries: 3
        chains:
          - chainId: "11155111"
            rpcUrl: http://127.0.0.1:1
            sweeperAddress: "0x1111111111111111111111111111111111111111"
            privateKey: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
            tokens:
              - symbol: USDC
                address: "0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238"
                decimals: 6
        tron:
          enabled: false
        solana:
          enabled: false
        YAML
        sed -i 's/^        //' /tmp/sweeper.yaml
        exec node commerce-dist/sweeper/index.js
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

volumes:
  api-data:

networks:
  internal:
    driver: bridge
