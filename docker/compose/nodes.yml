# FastSwap background nodes — no published ports; holds chain private keys.
# Run alongside api.yml on the same host (or a private network with API access).
services:
  sweep:
    image: fastswap-nodes:local
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    command: ["node", "app-dist/fastswap/app/fastswap/nodes/sweep-main.js", "/config/FastSwapConfig.yaml"]
    env_file:
      - .env
    environment:
      API_SIGNING_SECRET: ${API_SIGNING_SECRET}
      SWEEP_EVM_PRIVATE_KEY: ${SWEEP_EVM_PRIVATE_KEY}
      SWEEP_TRON_PRIVATE_KEY: ${SWEEP_TRON_PRIVATE_KEY}
    volumes:
      - ../../FastSwapConfig.yaml:/config/FastSwapConfig.yaml:ro
      - sweep-data:/app/data
    restart: unless-stopped

  relay:
    image: fastswap-nodes:local
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    command: ["node", "app-dist/fastswap/app/fastswap/nodes/relay-node/main.js", "/config/FastSwapConfig.yaml"]
    env_file:
      - .env
    environment:
      API_SIGNING_SECRET: ${API_SIGNING_SECRET}
      RELAY_EVM_PRIVATE_KEY: ${RELAY_EVM_PRIVATE_KEY}
      RELAY_TRON_PRIVATE_KEY: ${RELAY_TRON_PRIVATE_KEY}
    volumes:
      - ../../FastSwapConfig.yaml:/config/FastSwapConfig.yaml:ro
      - relay-data:/app/data
    restart: unless-stopped

  liqman:
    image: fastswap-nodes:local
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    command: ["node", "lm-dist/LiquidityManager/bot/index.js", "--fastswap-config", "/config/FastSwapConfig.yaml"]
    env_file:
      - .env
    environment:
      LM_PRIVATE_KEY: ${LM_PRIVATE_KEY}
    volumes:
      - ../../FastSwapConfig.yaml:/config/FastSwapConfig.yaml:ro
      - liqman-data:/app/data
    restart: unless-stopped

volumes:
  sweep-data:
  relay-data:
  liqman-data:
