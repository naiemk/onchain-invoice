<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Accept crypto payments with deterministic on-chain invoices. No account, no KYC — create a pay link in about a minute."
    />
    <link rel="canonical" href="https://trustlesscommerce.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trustless Commerce" />
    <meta
      property="og:description"
      content="Accept crypto payments with deterministic on-chain invoices. No account, no KYC."
    />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Trustless Commerce" />
    <meta
      name="twitter:description"
      content="Accept crypto payments with deterministic on-chain invoices."
    />
    <meta name="theme-color" content="#0a2540" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Trustless Commerce</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("tc-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
