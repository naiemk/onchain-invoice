serverUrl: "${SERVER_URL}"
# Wallet that signs sweeper API requests (must be registered via POST /api/admin/sweepers)
# Quote 0x values — unquoted YAML 1.1 treats them as integers and corrupts keys.
sweeperWalletKey: "${SWEEPER_WALLET_KEY}"
# Optional legacy shared key during migration
apiKey: "${SWEEPER_API_KEY}"
activityLogPath: "${ACTIVITY_LOG_PATH}"
intervalMs: 15000
maxRetries: 5
# Prefer SWEEPER_ROLE=evm|tron|all via compose (filters this shared file per process)
chains:
  - chainId: "11155111"
    rpcUrl: "${EVM_RPC_URL}"
    sweeperAddress: "${SWEEPER_ADDRESS}"
    privateKey: "${SWEEPER_PRIVATE_KEY}"
    tokens:
      - symbol: USDC
        address: "0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238"
        decimals: 6
tron:
  enabled: true
  chainId: "nile"
  fullHost: "${TRON_FULL_HOST}"
  invoiceMasterSecret: "${TRON_INVOICE_MASTER_SECRET}"
  # Nile USDT TRC-20 (override via TRON_USDT_ADDRESS if Nile listing changes)
  usdtAddress: "${TRON_USDT_ADDRESS}"
  privateKey: "${TRON_SPONSOR_PRIVATE_KEY}"
  feeLimit: 150000000
  energyMode: burn
  tokens:
    - symbol: USDT
      address: "${TRON_USDT_ADDRESS}"
      decimals: 6
solana:
  enabled: false
  note: "Not implemented for commerce launch"
