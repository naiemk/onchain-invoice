# FastSwap global configuration — single source of truth (no private keys).
# Amounts are human decimals: "10" USDT = 10.00 USDT, "0.05" ETH = 0.05 ETH.
# Tokens are defined once per chain; reference them by symbol elsewhere.
version: 1

active-chains:
  - base
  - arbitrum
  - bsc
  - tron
  # Optional — deploy and add to active-chains when ready:
  # - ethereum
  # - polygon

server:
  host: 0.0.0.0
  apiPort: 4010
  publicUrl: https://api.example.com
  sqlitePath: ./data/fastswap.sqlite
  auditLogPath: ./data/api-audit.jsonl
  signingSecretEnv: API_SIGNING_SECRET
  captcha:
    provider: cloudflare-turnstile
    siteKey: ""
    secretKey: ""
    requireForQuotes: true
    requireForInvoices: true

quote:
  feeBps: 75
  maxDeviationBps: 100
  quoteTtlSec: 900
  packsUsd:
    - "10"
    - "20"
    - "25"
    - "40"
    - "50"
    - "100"
    - "200"

sweepNode:
  pollIntervalMs: 30000
  pageLimit: 500
  confirmations: 3
  logScanOverlap: 100
  sqlitePath: "./data/sweep-node.sqlite"

relayNode:
  pollIntervalMs: 5000
  confirmations: 3

liquidityMonitor:
  pollIntervalMs: 15000

deploy:
  createx: "0xba5Ed099633D3B313e4D5F7bdc1305d3c28ba5Ed"
  owner: "${FASTSWAP_OWNER_ADDRESS}"
  # CREATE2 salts = keccak256("namespace/version/contract"), e.g. fastswap/1/fastSwapProxy
  salts:
    namespace: fastswap
    version: "1"
  contracts:
    fastSwapImplementation: ""
    fastSwapAddress: ""
    sweeperAddress: ""
    forwarderImplementation: ""
    liquidityManagerImplementation: ""
    liquidityManagerAddress: ""

liquidityManager:
  pollIntervalMs: 60000
  sqlitePath: "./data/liquidity-manager.sqlite"
  economics:
    gasGateBps: 50
    minNotionalUsd: 100
    maxStalenessSec: 3600
    riskCapUsd: 5000
    cooldownSec: 300
    slippageBps: 50
    maxGasPriceGwei: 40

nodes:
  sweep:
    auditLogPath: ./data/sweep-audit.jsonl
  relay:
    progressPath: ./data/relay-progress.json
    auditLogPath: ./data/relay-audit.jsonl
  liqman:
    auditLogPath: ./data/liqman-audit.jsonl

chains:
  - key: base
    id: "8453"
    type: evm
    name: Base
    optional: false
    rpcUrl: "${BASE_RPC_URL}"
    explorerUrl: https://basescan.org
    confirmations: 3
    startBlock: 0
    aggregatorSlug: base
    nativeSentinel: "0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE"
    router: "${BASE_ROUTER_ADDRESS}"
    tokens:
      ETH:
        decimals: 18
        isNative: true
        minLiquidity: "0"
        priceSources:
          - type: coingecko
            coinId: ethereum
          - type: binance
            symbol: ETHUSDT
      USDC:
        address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
        decimals: 6
        minLiquidity: "0"
        priceUsd: "1"
        priceSources:
          - type: coingecko
            coinId: usd-coin
    liquidity:
      reserveStable: USDC
      receivers:
        - tokens:
            ETH:
              floor: "0.02"
              target: "0.05"
              ceiling: "0.12"
            USDC:
              isStable: true
              floor: "100"
              target: "300"
              ceiling: "800"

