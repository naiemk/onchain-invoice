[package]
name = "commerce-invoice"
version = "0.1.0"
description = "Trustless Commerce Solana settle program (destination-bound PDA)"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "commerce_invoice"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
solana-program = "1.18"
spl-token = { version = "4", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "3", features = ["no-entrypoint"] }
thiserror = "1"
borsh = "1"
