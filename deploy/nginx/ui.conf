server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Unknown paths get a real HTTP 404 (prerendered noindex page). Keep the route
  # lists below in sync with ui/src/shared/seo-routes.json (checked by ui/scripts/check-nginx-routes.mjs).
  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Hashed Vite assets
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Checkout may be embedded cross-origin (merchant sites). Do not send X-Frame-Options.
  location = /pay {
    try_files /index.html =404;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors *" always;
  }

  # Prerendered, indexable marketing/legal pages (static HTML; client app takes over).
  location = / {
    try_files /index.html =404;
    include /etc/nginx/snippets/security-headers.conf;
  }
  location ~ ^/(get-paid|developers|integrations|security|create|legal|terms|privacy|cookies|risks|security-checks)/?$ {
    try_files /$1/index.html =404;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Client-only app routes (noindex), served the SPA shell.
  location ~ ^/(buy|merchant|wallet|admin)(/|$) {
    try_files /index.html =404;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Static files (favicon, images, fonts, robots.txt, sitemap.xml); anything else is 404.
  location / {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
