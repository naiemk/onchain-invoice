# Local operator deploy config (CREATE2 seed — no private keys).
# Copy to config.yaml (gitignored) and fill addresses / seed.
#
#   cp deploy/operator/config.example.yaml deploy/operator/config.yaml
#   npm run deploy:console
#
# Mainnet product EVM chains today: Base (8453) + BNB (56).
# Tron needs no contract deploy. Solana is separate (program id / authority).
# After CREATE2, copy addresses into deploy/.env.mainnet.api.example / VPS api-mainnet .env:
#   EVM_8453_SWEEPER_ADDRESS / EVM_8453_FORWARDER_IMPLEMENTATION
#   EVM_56_SWEEPER_ADDRESS / EVM_56_FORWARDER_IMPLEMENTATION

seed: "replace-with-long-random-operator-seed"

# EVM constructor params (addresses only — these bake into CREATE2 initcode).
# Deployer wallet (MetaMask) only pays gas; it does not need to equal owner.
feeBps: 50
feeRecipient: "0x0000000000000000000000000000000000000000"
owner: "0x0000000000000000000000000000000000000000"

# Nick's CREATE2 factory (same address on Ethereum / Sepolia / Base / BNB / most L2s).
create2Factory: "0x4e59b44847b379578588920cA78FbF26c0B4956C"

chains:
  # --- Mainnet ---
  # After deploy, paste into API/nodes env:
  #   EVM_8453_SWEEPER_ADDRESS / EVM_8453_FORWARDER_IMPLEMENTATION
  #   EVM_56_SWEEPER_ADDRESS / EVM_56_FORWARDER_IMPLEMENTATION
  base:
    kind: evm
    chainId: 8453
    rpcUrl: https://mainnet.base.org
    explorer: https://basescan.org
    enabled: true
    sweeper: ""
    forwarderImplementation: ""
    deployedAt: ""
    deployTx: ""
  bsc:
    kind: evm
    chainId: 56
    rpcUrl: https://bsc-dataseed.binance.org
    explorer: https://bscscan.com
    enabled: true
    sweeper: ""
    forwarderImplementation: ""
    deployedAt: ""
    deployTx: ""
  # --- Testnet (optional) ---
  sepolia:
    kind: evm
    chainId: 11155111
    rpcUrl: https://ethereum-sepolia-rpc.publicnode.com
    explorer: https://sepolia.etherscan.io
    enabled: true
    sweeper: ""
    forwarderImplementation: ""
    deployedAt: ""
    deployTx: ""

solana:
  kind: solana
  chainId: devnet
  rpcUrl: https://api.devnet.solana.com
  enabled: false
  feeBps: 50
  # Authority / fee recipient pubkeys (base58) — not secret keys
  authority: ""
  feeRecipient: ""
  programId: ""
  configPda: ""
  deployedAt: ""
  initializeTx: ""
