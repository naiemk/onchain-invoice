# Trustless Commerce — infra packager product config
# Infra reads only packager fields; app YAML and .env contents are opaque.

name: trustless-commerce
version: 1

rawBase: https://raw.githubusercontent.com/naiemk/onchain-invoice/main/deploy/templates
packagerRaw: https://raw.githubusercontent.com/naiemk/onchain-invoice/main/infra

network:
  edge: trustless-commerce-edge

images:
  backend: ghcr.io/naiemk/trustless-commerce-api:main
  ui: ghcr.io/naiemk/trustless-commerce-ui:main
  worker: ghcr.io/naiemk/trustless-commerce-sweeper:main
  nginx: ghcr.io/naiemk/trustless-commerce-nginx:main

autoUpdate:
  lockFile: /var/lock/infra-auto-update.lock

profiles:
  api:
    role: backend
    templates:
      config: onchain-invoice-api.yaml
      envExample: .env.api.example
    startScript: start-onchain-invoice-api.sh
    updateScript: update-onchain-invoice-api.sh
    autoUpdate:
      flag: API_AUTO_UPDATE
      intervalEnv: API_AUTO_UPDATE_INTERVAL_MIN
      offset: 0
      stopTimeoutEnv: API_STOP_TIMEOUT

  nodes:
    role: workers
    templates:
      config: onchain-invoice-nodes.yaml
      envExample: .env.nodes.example
      compose: docker-compose.sweepers.yml
      composeMainnet: docker-compose.sweepers-mainnet.yml
    startScript: start-onchain-invoice-nodes.sh
    updateScript: update-onchain-invoice-nodes.sh
    extras:
      - register-onchain-invoice-node.sh
    autoUpdate:
      flag: NODES_AUTO_UPDATE
      intervalEnv: NODES_AUTO_UPDATE_INTERVAL_MIN
      offset: 10
      stopTimeoutEnv: NODES_STOP_TIMEOUT
    workers:
      services:
        - name: sweeper-evm
          containerName: onchain-invoice-sweeper-evm
          roleEnv: SWEEPER_ROLE=evm
          activityLog: /data/logs/activity-evm.jsonl
        - name: sweeper-tron
          containerName: onchain-invoice-sweeper-tron
          roleEnv: SWEEPER_ROLE=tron
          activityLog: /data/logs/activity-tron.jsonl
        - name: sweeper-solana
          containerName: onchain-invoice-sweeper-solana
          profile: solana
          roleEnv: SWEEPER_ROLE=solana
          activityLog: /data/logs/activity-solana.jsonl

  gateway:
    role: gateway
    mode: standalone
    templates:
      envExample: .env.gateway.example
      nginxInclude: gateway/conf.d/domains.conf
    startScript: start-onchain-invoice-gateway.sh
    updateScript: update-onchain-invoice-gateway.sh
    autoUpdate:
      flags:
        - UI_TESTNET_AUTO_UPDATE
        - UI_MAINNET_AUTO_UPDATE
        - GATEWAY_AUTO_UPDATE
      intervalEnv: GATEWAY_AUTO_UPDATE_INTERVAL_MIN
      offset: 20
      stopTimeoutEnv: GATEWAY_STOP_TIMEOUT
    sites:
      - host: testnet.trustless-commerce.com
        backend: testnet-api
        backendPort: 8080
        ui: testnet-ui
        uiPort: 80
        tlsCertDir: /etc/letsencrypt/live/trustless-commerce.com
      - host: trustless-commerce.com
        aliases:
          - www.trustless-commerce.com
        backend: mainnet-api
        backendPort: 8080
        ui: mainnet-ui
        uiPort: 80
        tlsCertDir: /etc/letsencrypt/live/trustless-commerce.com
