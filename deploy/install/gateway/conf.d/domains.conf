# Hostname-based routing for testnet + mainnet on one edge nginx.
# Mount this directory as /etc/nginx/conf.d (replaces local api.conf).

upstream testnet_api_upstream {
  server testnet-api:8080;
}
upstream testnet_ui_upstream {
  server testnet-ui:80;
}
upstream mainnet_api_upstream {
  server mainnet-api:8080;
}
upstream mainnet_ui_upstream {
  server mainnet-ui:80;
}

# HTTP: ACME + redirect to HTTPS
server {
  listen 80 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# --- testnet.trustless-commerce.com ---
server {
  listen 443 ssl;
  http2 on;
  server_name testnet.trustless-commerce.com;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  limit_conn addr 40;

  location = /api/health {
    proxy_pass http://testnet_api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/invoices {
    limit_req zone=api_create burst=2 nodelay;
    proxy_pass http://testnet_api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api_public burst=40 nodelay;
    proxy_pass http://testnet_api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://testnet_ui_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# --- trustless-commerce.com (+ www) ---
