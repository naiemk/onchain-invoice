# Triple sweeper processes + optional bundler sharing YAML + .env.
# From the nodes install directory:
#   docker compose -f docker-compose.sweepers.yml up -d
# Solana (optional): SWEEPER_SOLANA_ENABLED=1 and:
#   docker compose -f docker-compose.sweepers.yml --profile solana up -d
#
# SWEEPER_ROLE filters which half of onchain-invoice-nodes.yaml each service uses.
# VPS refresh (replace old single/dual layout):
#   docker rm -f onchain-invoice-node onchain-invoice-sweeper-evm onchain-invoice-sweeper-tron onchain-invoice-sweeper-solana 2>/dev/null || true
#   wget -qO- https://raw.githubusercontent.com/naiemk/onchain-invoice/main/deploy/install/install-nodes.sh | bash
#   # edit .env then:
#   ./register-onchain-invoice-node.sh
#   ./register-onchain-invoice-bundler.sh
#   ./start-onchain-invoice-nodes.sh

networks:
  edge:
    external: true
    name: ${DOCKER_NETWORK:-trustless-commerce-edge}

services:
  sweeper-evm:
    image: ${SWEEPER_IMAGE:-ghcr.io/naiemk/trustless-commerce-sweeper:main}
    container_name: onchain-invoice-sweeper-evm
    restart: unless-stopped
    mem_limit: ${SWEEPER_MEMORY_LIMIT:-192m}
    env_file: .env
    environment:
      SWEEPER_ROLE: evm
      SWEEPER_CONFIG: /tmp/sweeper.yaml
      ACTIVITY_LOG_PATH: /data/logs/activity-evm.jsonl
    volumes:
      - ./logs:/data/logs
      - ./onchain-invoice-nodes.yaml:/tmp/sweeper.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge

  sweeper-tron:
    image: ${SWEEPER_IMAGE:-ghcr.io/naiemk/trustless-commerce-sweeper:main}
    container_name: onchain-invoice-sweeper-tron
    restart: unless-stopped
    mem_limit: ${SWEEPER_MEMORY_LIMIT:-192m}
    env_file: .env
    environment:
      SWEEPER_ROLE: tron
      SWEEPER_CONFIG: /tmp/sweeper.yaml
      ACTIVITY_LOG_PATH: /data/logs/activity-tron.jsonl
    volumes:
      - ./logs:/data/logs
      - ./onchain-invoice-nodes.yaml:/tmp/sweeper.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge

  sweeper-solana:
    profiles: ["solana"]
    image: ${SWEEPER_IMAGE:-ghcr.io/naiemk/trustless-commerce-sweeper:main}
    container_name: onchain-invoice-sweeper-solana
    restart: unless-stopped
    mem_limit: ${SWEEPER_MEMORY_LIMIT:-192m}
    env_file: .env
    environment:
      SWEEPER_ROLE: solana
      SWEEPER_CONFIG: /tmp/sweeper.yaml
      ACTIVITY_LOG_PATH: /data/logs/activity-solana.jsonl
    volumes:
      - ./logs:/data/logs
      - ./onchain-invoice-nodes.yaml:/tmp/sweeper.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge

  bundler-evm:
    image: ${BUNDLER_IMAGE:-ghcr.io/naiemk/trustless-commerce-bundler:main}
    container_name: onchain-invoice-bundler-evm
    restart: unless-stopped
    mem_limit: ${BUNDLER_MEMORY_LIMIT:-192m}
    env_file: .env
    environment:
      BUNDLER_CONFIG: /tmp/bundler.yaml
      ACTIVITY_LOG_PATH: /data/logs/activity-bundler.jsonl
    volumes:
      - ./logs:/data/logs
      - ./onchain-invoice-bundler.yaml:/tmp/bundler.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge

  wallet-deployer-evm:
    image: ${WALLET_DEPLOYER_IMAGE:-ghcr.io/naiemk/trustless-commerce-wallet-deployer:main}
    container_name: onchain-invoice-wallet-deployer-evm
    restart: unless-stopped
    mem_limit: ${WALLET_DEPLOYER_MEMORY_LIMIT:-192m}
    env_file: .env
    environment:
      WALLET_DEPLOYER_CONFIG: /tmp/wallet-deployer.yaml
      ACTIVITY_LOG_PATH: /data/logs/activity-wallet-deployer.jsonl
    volumes:
      - ./logs:/data/logs
      - ./onchain-invoice-wallet-deployer.yaml:/tmp/wallet-deployer.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge
