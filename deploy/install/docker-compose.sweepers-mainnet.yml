# Sweeper processes for MAINNET (alongside testnet sweepers on the same host).
# Container names differ so they do not collide with onchain-invoice-sweeper-*.
# No Solana service on mainnet compose (leave off until program is live).
#
#   docker compose -f docker-compose.sweepers-mainnet.yml --env-file .env.runtime up -d

services:
  sweeper-evm:
    image: ${SWEEPER_IMAGE:-ghcr.io/naiemk/trustless-commerce-sweeper:main}
    container_name: mainnet-sweeper-evm
    restart: unless-stopped
    mem_limit: ${SWEEPER_MEMORY_LIMIT:-192m}
    env_file: ${ENV_FILE:-.env.runtime}
    environment:
      SWEEPER_ROLE: evm
      SWEEPER_CONFIG: /tmp/sweeper.yaml
      ACTIVITY_LOG_PATH: /data/logs/activity-evm.jsonl
    volumes:
      - ./logs:/data/logs
      - ./onchain-invoice-nodes.yaml:/tmp/sweeper.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sweeper-tron:
    image: ${SWEEPER_IMAGE:-ghcr.io/naiemk/trustless-commerce-sweeper:main}
    container_name: mainnet-sweeper-tron
    restart: unless-stopped
    mem_limit: ${SWEEPER_MEMORY_LIMIT:-192m}
    env_file: ${ENV_FILE:-.env.runtime}
    environment:
      SWEEPER_ROLE: tron
      SWEEPER_CONFIG: /tmp/sweeper.yaml
      ACTIVITY_LOG_PATH: /data/logs/activity-tron.jsonl
    volumes:
      - ./logs:/data/logs
      - ./onchain-invoice-nodes.yaml:/tmp/sweeper.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
