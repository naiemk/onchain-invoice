# Trustless Commerce API — operator config
# Created by: wget -qO- https://raw.githubusercontent.com/naiemk/onchain-invoice/main/deploy/install/install-api.sh | bash
# Start with: ./start-onchain-invoice-api.sh

docker:
  image: ghcr.io/naiemk/trustless-commerce-api:main
  # For HTTPS gateway use DOCKER_NAME=testnet-api|mainnet-api in .env (overrides this name).
  name: onchain-invoice-api
  # Host port published to the container's 8080 (use 8081 for a second API on the same host)
  port: 8080
  dataDir: ./data/onchain-invoice-api
  restart: unless-stopped

# Application settings (mounted as CONFIG_PATH; ${ENV} expanded at runtime from .env)
port: 8080
baseUrl: "${BASE_URL}"
db:
  path: /data/trustless-commerce.db
adminApiKey: "${ADMIN_API_KEY}"
sweeperApiKey: "${SWEEPER_API_KEY}"
evm:
  rpcUrl: "${EVM_RPC_URL}"
  # Quote 0x values — unquoted YAML 1.1 parses them as ints and corrupts addresses.
  sweeperAddress: "${SWEEPER_ADDRESS}"
  forwarderImplementation: "${FORWARDER_IMPLEMENTATION}"
cors:
  origins:
    - "*"
rateLimit:
  createPerSecond: 1
  publicPerIpPerSecond: 20
  sweeperPerIpPerSecond: 50
claimLeaseMs: 180000
