# Trustless Commerce sweeper node — operator config (shared by evm + tron compose services)
# Created by: wget -qO- https://raw.githubusercontent.com/naiemk/onchain-invoice/main/deploy/install/install-nodes.sh | bash
# Dual services: docker compose -f docker-compose.sweepers.yml up -d
# Legacy single container: ./start-onchain-invoice-nodes.sh

docker:
  image: ghcr.io/naiemk/trustless-commerce-sweeper:main
  name: onchain-invoice-node
  restart: unless-stopped

# Worker settings (this file is mounted as SWEEPER_CONFIG; ${ENV} from .env)
# Prefer https://testnet.trustless-commerce.com (or your API). host.docker.internal:8080 only if API publishes 8080 on this host.
serverUrl: "${SERVER_URL}"
# Wallet that signs sweeper API requests (./register-onchain-invoice-node.sh)
# Quote 0x values — unquoted YAML 1.1 treats them as integers and corrupts keys.
sweeperWalletKey: "${SWEEPER_WALLET_KEY}"
# Optional legacy shared key
apiKey: "${SWEEPER_API_KEY}"
# Host bind-mount ./logs → /data/logs (see start / compose)
activityLogPath: "${ACTIVITY_LOG_PATH}"
intervalMs: 15000
maxRetries: 5
chains:
  - chainId: "11155111"
    rpcUrl: "${EVM_RPC_URL}"
    sweeperAddress: "${SWEEPER_ADDRESS}"
    privateKey: "${SWEEPER_PRIVATE_KEY}"
    tokens:
      - symbol: USDC
        address: "0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238"
        decimals: 6
tron:
  enabled: true
  chainId: "nile"
  fullHost: "${TRON_FULL_HOST}"
  invoiceMasterSecret: "${TRON_INVOICE_MASTER_SECRET}"
  usdtAddress: "${TRON_USDT_ADDRESS}"
  privateKey: "${TRON_SPONSOR_PRIVATE_KEY}"
  feeLimit: 150000000
  # Delegate ENERGY + BANDWIDTH (no liquid TRX sent to invoice EOAs). Sponsor must stake TRX.
  energyMode: staked
  # Sun of staked TRX to delegate (Stake 2.0)
  minDelegateEnergy: 65000000
  minDelegateBandwidth: 1500000
  tokens:
    - symbol: USDT
      address: "${TRON_USDT_ADDRESS}"
      decimals: 6
solana:
  enabled: false
  note: "Not implemented for commerce launch"
