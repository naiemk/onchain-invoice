serverUrl: "${SERVER_URL}"
sweeperWalletKey: "${SWEEPER_WALLET_KEY}"
apiKey: "${SWEEPER_API_KEY}"
activityLogPath: "${ACTIVITY_LOG_PATH}"
intervalMs: 15000
maxRetries: 5
chains:
  - chainId: 11155111
    rpcUrl: ${EVM_RPC_URL}
    sweeperAddress: ${SWEEPER_ADDRESS}
    privateKey: ${SWEEPER_PRIVATE_KEY}
    tokens:
    - {'symbol': 'USDC', 'address': '0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238', 'decimals': 6}
  - chainId: 8453
    rpcUrl: ${EVM_8453_RPC_URL}
    sweeperAddress: ${EVM_8453_SWEEPER_ADDRESS}
    privateKey: ${SWEEPER_PRIVATE_KEY}
    tokens:
    - {'symbol': 'USDC', 'address': '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913', 'decimals': 6}
  - chainId: 56
    rpcUrl: ${EVM_56_RPC_URL}
    sweeperAddress: ${EVM_56_SWEEPER_ADDRESS}
    privateKey: ${SWEEPER_PRIVATE_KEY}
    tokens:
    - {'symbol': 'USDC', 'address': '0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d', 'decimals': 18}
    - {'symbol': 'USDT', 'address': '0x55d398326f99059fF775485246999027B3197955', 'decimals': 18}
tron:
  enabled: true
  chainId: "${TRON_CHAIN_ID}"
  fullHost: "${TRON_FULL_HOST}"
  invoiceMasterSecret: "${TRON_INVOICE_MASTER_SECRET}"
  usdtAddress: "${TRON_USDT_ADDRESS}"
  privateKey: "${TRON_SPONSOR_PRIVATE_KEY}"
  feeLimit: 150000000
  energyMode: staked
  minDelegateEnergy: 65000000
  minDelegateBandwidth: 1500000
  tokens:
    - symbol: USDT
      address: ${TRON_USDT_ADDRESS}
      decimals: 6
solana:
  enabled: true
  privateKey: "${SOLANA_SWEEPER_KEY}"
  feeRecipient: "${SOLANA_FEE_RECIPIENT}"
  feeBps: 50
  chains:
    devnet:
      enabled: true
      rpcUrl: "${SOLANA_RPC_URL}"
      programId: "${SOLANA_PROGRAM_ID}"
      tokens:
        USDC:
          mint: "${SOLANA_USDC_MINT}"
          decimals: 6
        USDT:
          mint: "${SOLANA_USDT_MINT}"
          decimals: 6
    mainnet-beta:
      enabled: false
      rpcUrl: "${SOLANA_MAINNET_RPC_URL}"
      programId: "${SOLANA_MAINNET_PROGRAM_ID}"
      tokens:
        USDC:
          mint: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
          decimals: 6
        USDT:
          mint: Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB
          decimals: 6
