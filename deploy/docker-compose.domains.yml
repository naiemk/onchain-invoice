# Dual-domain stack: testnet.trustless-commerce.com + trustless-commerce.com
# on one host (80/443). Pull-only GHCR images.
#
#   cp deploy/.env.testnet.example deploy/.env.testnet
#   cp deploy/.env.mainnet.example deploy/.env.mainnet
#   # edit secrets, then:
#   docker compose -f deploy/docker-compose.domains.yml --env-file deploy/.env.domains pull
#   docker compose -f deploy/docker-compose.domains.yml --env-file deploy/.env.domains up -d
#
name: trustless-commerce-domains

services:
  testnet-api:
    image: ghcr.io/naiemk/trustless-commerce-api:${IMAGE_TAG:-main}
    env_file:
      - .env.testnet
    environment:
      CONFIG_PATH: /config/server.yaml
      DB_PATH: /data/trustless-commerce.db
      CORS_ORIGINS: ${TESTNET_CORS_ORIGINS:-https://testnet.trustless-commerce.com}
      RATE_LIMIT_CREATE_PER_SECOND: ${TESTNET_RATE_LIMIT_CREATE_PER_SECOND:-5}
    volumes:
      - ${TESTNET_DATA_DIR:-/var/lib/trustless-commerce/testnet/api}:/data
      - ./config/server.domains.yaml:/config/server.yaml:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - edge

  testnet-ui:
    image: ghcr.io/naiemk/trustless-commerce-ui:${IMAGE_TAG:-main}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - edge

  mainnet-api:
    image: ghcr.io/naiemk/trustless-commerce-api:${IMAGE_TAG:-main}
    env_file:
      - .env.mainnet
    environment:
      CONFIG_PATH: /config/server.yaml
      DB_PATH: /data/trustless-commerce.db
      CORS_ORIGINS: ${MAINNET_CORS_ORIGINS:-https://trustless-commerce.com,https://www.trustless-commerce.com}
      RATE_LIMIT_CREATE_PER_SECOND: ${MAINNET_RATE_LIMIT_CREATE_PER_SECOND:-1}
    volumes:
      - ${MAINNET_DATA_DIR:-/var/lib/trustless-commerce/mainnet/api}:/data
      - ./config/server.domains.yaml:/config/server.yaml:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - edge

  mainnet-ui:
    image: ghcr.io/naiemk/trustless-commerce-ui:${IMAGE_TAG:-main}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - edge

  nginx:
    image: ghcr.io/naiemk/trustless-commerce-nginx:${IMAGE_TAG:-main}
    depends_on:
      testnet-api:
        condition: service_healthy
      mainnet-api:
        condition: service_healthy
      testnet-ui:
        condition: service_started
      mainnet-ui:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/domains:/etc/nginx/conf.d:ro
      - ${TLS_FULLCHAIN:-/etc/letsencrypt/live/trustless-commerce.com/fullchain.pem}:/etc/nginx/certs/fullchain.pem:ro
      - ${TLS_PRIVKEY:-/etc/letsencrypt/live/trustless-commerce.com/privkey.pem}:/etc/nginx/certs/privkey.pem:ro
      - ${CERTBOT_WWW:-/var/www/certbot}:/var/www/certbot:ro
    restart: unless-stopped
    networks:
      - edge

networks:
  edge:
    driver: bridge
