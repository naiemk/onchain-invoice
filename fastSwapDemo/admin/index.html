<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastSwap Demo Admin</title>
    <style>
      body {
        background: #101828;
        color: #eef4ff;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 32px;
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
      .card {
        background: #18233a;
        border: 1px solid #2b3b5f;
        border-radius: 18px;
        padding: 20px;
      }
      code {
        overflow-wrap: anywhere;
      }
      .muted {
        color: #9fb0d0;
      }
      .log-hint {
        margin: 0 0 12px;
        font-size: 14px;
      }
      .node-health {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 16px 0 24px;
      }
      .health-pill {
        align-items: center;
        background: #14213a;
        border: 1px solid #2b3b5f;
        border-radius: 999px;
        display: inline-flex;
        gap: 8px;
        padding: 8px 12px;
      }
      .health-dot {
        border-radius: 50%;
        display: inline-block;
        height: 9px;
        width: 9px;
      }
      .health-dot.ok {
        background: #5eb88a;
      }
      .health-dot.warn {
        background: #e8b84d;
      }
      .health-dot.error,
      .health-dot.stale {
        background: #f97066;
      }
      .liquidity-list {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }
      .liquidity-row {
        background: #101a2f;
        border: 1px solid #2b3b5f;
        border-radius: 12px;
        padding: 12px;
      }
      .liquidity-row.low {
        border-color: #e8b84d;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin: 24px 0 16px;
        border-bottom: 1px solid #2b3b5f;
        padding-bottom: 0;
      }
      .tabs button {
        background: transparent;
        border: none;
        color: #9fb0d0;
        cursor: pointer;
        font: inherit;
        padding: 10px 16px;
        border-radius: 10px 10px 0 0;
      }
      .tabs button:hover {
        color: #eef4ff;
        background: #1a2744;
      }
      .tabs button.active {
        color: #eef4ff;
        background: #18233a;
        border: 1px solid #2b3b5f;
        border-bottom-color: #18233a;
        margin-bottom: -1px;
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }
      .log-view {
        background: #0c1220;
        border: 1px solid #2b3b5f;
        border-radius: 12px;
        max-height: min(70vh, 640px);
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
      }
      .log-row {
        padding: 10px 14px;
        border-bottom: 1px solid #1f2d4a;
      }
      .log-row:last-child {
        border-bottom: none;
      }
      .log-time {
        color: #6b7fa3;
        margin-right: 8px;
      }
      .log-level {
        display: inline-block;
        min-width: 3.5em;
        font-weight: 600;
        margin-right: 8px;
      }
      .log-level.debug {
        color: #7a8fb8;
      }
      .log-level.info {
        color: #5eb88a;
      }
      .log-level.warn {
        color: #e8b84d;
      }
      .log-level.error {
        color: #f97066;
      }
      .log-meta {
        margin-top: 6px;
        color: #9fb0d0;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>FastSwap Demo Admin</h1>
    <p class="muted">Local-only node monitor for AliceChain and BobChain.</p>

    <nav class="tabs" role="tablist">
      <button type="button" class="active" data-tab="dashboard" role="tab" aria-selected="true">Dashboard</button>
      <button type="button" data-tab="sweep-logs" role="tab" aria-selected="false">Sweep node log</button>
      <button type="button" data-tab="relay-logs" role="tab" aria-selected="false">Relay node log</button>
    </nav>
    <p class="muted log-hint">
      Node audit logs are append-only JSONL files under <code>fastSwapDemo/state/</code> (not served by the API).
    </p>

    <section id="panel-dashboard" class="panel active" role="tabpanel">
      <section class="node-health" id="node-health"></section>
      <section class="grid" id="config"></section>
      <h2>Recent invoices</h2>
      <section class="grid" id="invoices"></section>
    </section>

    <section id="panel-sweep-logs" class="panel" role="tabpanel">
      <div class="log-view" id="sweep-logs"></div>
    </section>

    <section id="panel-relay-logs" class="panel" role="tabpanel">
      <div class="log-view" id="relay-logs"></div>
    </section>

    <script>
      const api = globalThis.FASTSWAP_API_BASE;
      const nodeKey = globalThis.FASTSWAP_NODE_API_KEY ?? "fastswap-demo-node";
      const nodeHeaders = { "x-api-key": nodeKey };

      function txLine(label, tx) {
        if (!tx?.txHash) return "";
        const meta = [tx.status, tx.gasUsed != null && `gas ${tx.gasUsed}`].filter(Boolean).join(" · ");
        const inner = tx.explorerTxUrl
          ? `<a href="${tx.explorerTxUrl}" target="_blank" rel="noopener noreferrer">${tx.txHash.slice(0, 10)}…</a>`
          : `<code>${tx.txHash}</code>`;
        return `<p class="muted"><strong>${label}</strong> ${inner}${meta ? ` · ${meta}` : ""}</p>`;
      }

      function formatLogRow(log) {
        const t = new Date(log.createdAt).toISOString();
        const lvl = (log.level || "info").toLowerCase();
        const meta =
          log.metadata && Object.keys(log.metadata).length > 0
            ? `<div class="log-meta">${escapeHtml(JSON.stringify(log.metadata, null, 2))}</div>`
            : "";
        return `<div class="log-row"><span class="log-time">${escapeHtml(t)}</span><span class="log-level ${escapeHtml(lvl)}">${escapeHtml(
          lvl
        )}</span><span>${escapeHtml(log.message)}</span>${meta}</div>`;
      }

      function formatNodeHealth(node) {
        const ageMs = Date.now() - Number(node.updatedAt || 0);
        const stale = ageMs > 15000;
        const level = stale ? "stale" : (node.level || "info").toLowerCase();
        const status = stale ? "stale" : level === "error" ? "error" : level === "warn" ? "warn" : "ok";
        const age = Number.isFinite(ageMs) ? `${Math.max(0, Math.round(ageMs / 1000))}s ago` : "unknown";
        return `<span class="health-pill" title="${escapeHtml(JSON.stringify(node.metadata || {}))}">
          <span class="health-dot ${escapeHtml(status)}"></span>
          <strong>${escapeHtml(node.source)}</strong>
          <span>${escapeHtml(node.message)}</span>
          <span class="muted">${escapeHtml(age)}</span>
        </span>`;
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function fetchNodeLogs() {
        return { logs: [] };
      }

      async function refreshNodeHealth() {
        const el = document.querySelector("#node-health");
        el.innerHTML =
          '<span class="health-pill"><span class="health-dot ok"></span><strong>nodes</strong><span>Audit logs: fastSwapDemo/state/*-audit.jsonl</span></span>';
      }

      async function refreshDashboard() {
        const [config, invoices, liquidity] = await Promise.all([
          fetch(`${api}/config`).then((r) => r.json()),
          fetch(`${api}/invoices`, { headers: nodeHeaders }).then((r) => r.json()),
          fetch(`${api}/liquidity`, { headers: nodeHeaders }).then((r) => (r.ok ? r.json() : { liquidity: [] })),
        ]);
        await refreshNodeHealth();
        document.querySelector("#config").innerHTML = config.chains
          .map(
            (chain) => `
              <article class="card">
                <h3>${chain.name}</h3>
                <p><strong>FastSwap</strong><br><code>${chain.fastSwapAddress}</code></p>
                <p><strong>Sweeper</strong><br><code>${chain.sweeperAddress}</code></p>
                <p><strong>Tokens</strong><br>${chain.tokens.map((t) => t.symbol).join(", ")}</p>
                <p><strong>Liquidity available</strong></p>
                ${renderLiquidity(chain, liquidity.liquidity || [])}
              </article>
            `
          )
          .join("");
        document.querySelector("#invoices").innerHTML =
          invoices.invoices
            ?.map(({ invoice }) => {
              const sweep = txLine("Sweep", invoice.sweep?.tx);
              const relay = txLine("Relay", invoice.relay?.tx);
              const payout = txLine("Payout", invoice.payout?.tx);
              const onchain = [sweep, relay, payout].filter(Boolean).join("") || "<p class=\"muted\">No sweep / relay telemetry yet.</p>";
              return `
                <article class="card">
                  <h3>${invoice.status}</h3>
                  <p><strong>Invoice</strong><br><code>${invoice.invoiceId}</code></p>
                  <p><strong>Address</strong><br><code>${invoice.invoiceAddress}</code></p>
                  <p>${invoice.sourceChainId} → ${invoice.targetChainId}</p>
                  ${onchain}
                </article>
              `;
            })
            .join("") || "<p>No invoices yet.</p>";
      }

      function renderLiquidity(chain, rows) {
        const matches = rows.filter((row) => String(row.chainId) === String(chain.id));
        if (!matches.length) return '<p class="muted">No liquidity data yet.</p>';
        return `<div class="liquidity-list">${matches
          .map((row) => {
            const token = chain.tokens.find((candidate) => candidate.symbol === row.token);
            const decimals = token?.decimals ?? 0;
            const available = maxBigInt(0n, BigInt(row.balance || "0") - BigInt(row.reserved || "0") - BigInt(row.queuedAmount || "0"));
            return `
              <div class="liquidity-row ${row.lowLiquidity ? "low" : ""}">
                <div><strong>${escapeHtml(row.token)}</strong> <span class="muted">${escapeHtml(formatUnits(available, decimals))} available</span></div>
                <div class="muted small">balance ${escapeHtml(formatUnits(row.balance, decimals))} · reserved ${escapeHtml(formatUnits(row.reserved, decimals))} · queued ${escapeHtml(formatUnits(row.queuedAmount, decimals))}</div>
              </div>
            `;
          })
          .join("")}</div>`;
      }

      function maxBigInt(min, value) {
        return value < min ? min : value;
      }

      function formatUnits(value, decimals) {
        const raw = String(value ?? "0");
        if (!/^\d+$/.test(raw)) return raw;
        if (!decimals) return raw;
        const padded = raw.padStart(decimals + 1, "0");
        const whole = padded.slice(0, -decimals) || "0";
        const fraction = padded.slice(-decimals).replace(/0+$/, "");
        const shown = fraction.length > 6 ? `${fraction.slice(0, 6)}…` : fraction;
        return `${whole}${shown ? `.${shown}` : ""}`;
      }

      async function refreshSweepLogs() {
        const el = document.querySelector("#sweep-logs");
        el.innerHTML = '<div class="log-row muted">See fastSwapDemo/state/sweep-audit.jsonl (if sweep node is running with audit enabled).</div>';
      }

      async function refreshRelayLogs() {
        const el = document.querySelector("#relay-logs");
        el.innerHTML = '<div class="log-row muted">See fastSwapDemo/state/relay-audit.jsonl.</div>';
      }

      function setTab(id) {
        document.querySelectorAll(".tabs button").forEach((btn) => {
          const on = btn.dataset.tab === id;
          btn.classList.toggle("active", on);
          btn.setAttribute("aria-selected", on ? "true" : "false");
        });
        document.querySelectorAll(".panel").forEach((p) => {
          p.classList.toggle("active", p.id === `panel-${id}`);
        });
      }

      document.querySelectorAll(".tabs button").forEach((btn) => {
        btn.addEventListener("click", () => {
          setTab(btn.dataset.tab);
          const id = btn.dataset.tab;
          if (id === "dashboard") void refreshDashboard();
          if (id === "sweep-logs") void refreshSweepLogs();
          if (id === "relay-logs") void refreshRelayLogs();
        });
      });

      async function refresh() {
        const dash = document.querySelector("#panel-dashboard");
        if (dash.classList.contains("active")) await refreshDashboard();
        if (document.querySelector("#panel-sweep-logs").classList.contains("active")) await refreshSweepLogs();
        if (document.querySelector("#panel-relay-logs").classList.contains("active")) await refreshRelayLogs();
      }

      refreshDashboard();
      refreshSweepLogs();
      refreshRelayLogs();
      setInterval(refresh, 3000);
    </script>
  </body>
</html>
