  captchaToken: demo-captcha

wallet:
  privateKey: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

quote:
  feeBps: 75
  maxDeviationBps: 10000
  packsUsdMicros:
    - "10000000"
