port: 8080
baseUrl: ${BASE_URL}
db:
  path: ${DB_PATH}
adminApiKey: ${ADMIN_API_KEY}
sweeperApiKey: ${SWEEPER_API_KEY}
evm:
  rpcUrl: ${EVM_RPC_URL}
  sweeperAddress: ${SWEEPER_ADDRESS}
  forwarderImplementation: ${FORWARDER_IMPLEMENTATION}
tron:
  fullHost: ${TRON_FULL_HOST}
  invoiceMasterSecret: ${TRON_INVOICE_MASTER_SECRET}
  usdtAddress: ${TRON_USDT_ADDRESS}
# Solana: same code for every chainId — only entries differ.
# mainnet-beta stays disabled until SOLANA_MAINNET_ENABLED=1 and a real programId is set.
solana:
  chains:
    devnet:
      enabled: false
      rpcUrl: ${SOLANA_RPC_URL}
      programId: ${SOLANA_PROGRAM_ID}
      tokens:
        USDC:
          mint: ${SOLANA_USDC_MINT}
          decimals: 6
        USDT:
          mint: ${SOLANA_USDT_MINT}
          decimals: 6
    mainnet-beta:
      enabled: false
      rpcUrl: ${SOLANA_MAINNET_RPC_URL}
      programId: ${SOLANA_MAINNET_PROGRAM_ID}
      tokens:
        USDC:
          mint: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
          decimals: 6
        USDT:
          mint: Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB
          decimals: 6
cors:
  origins:
    - http://localhost:5173
    - http://localhost:5174
    - https://trustlesscommerce.app
rateLimit:
  createPerSecond: 1
  publicPerIpPerSecond: 20
  sweeperPerIpPerSecond: 50
claimLeaseMs: 180000
