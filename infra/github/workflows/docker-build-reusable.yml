# Reusable GHCR docker build — one image per workflow_call.
#
# Caller (repeat per image or use a matrix in the caller workflow):
#
#   jobs:
#     build-api:
#       uses: ./infra/github/workflows/docker-build-reusable.yml
#       with:
#         dockerfile: deploy/Dockerfile.api
#         image: ghcr.io/${{ github.repository_owner }}/trustless-commerce-api
#         context: .
#       secrets: inherit

name: Reusable docker build (single image)

on:
  workflow_call:
    inputs:
      dockerfile:
        required: true
        type: string
      image:
        required: true
        type: string
      context:
        required: false
        type: string
        default: .

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
