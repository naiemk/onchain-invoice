name: System tests

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to pull"
        required: false
        default: "main"
  schedule:
    - cron: "0 6 * * *"
  workflow_run:
    workflows: ["Docker images"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  system-test:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            # Nightly / post-Docker: always exercise the latest published :main images.
            echo "image_tag=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Run system tests against published images
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          PULL: "1"
        run: |
          chmod +x system-tests/scripts/*.sh system-tests/tests/*.sh deploy/gen-dev-certs.sh
          cp system-tests/.env.example system-tests/.env
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" system-tests/.env
          echo "Testing IMAGE_TAG=${IMAGE_TAG}"
          npm run system-test
