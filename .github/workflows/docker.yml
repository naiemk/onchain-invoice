name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/trustless-commerce-api
  IMAGE_SWEEPER: ghcr.io/${{ github.repository_owner }}/trustless-commerce-sweeper
  IMAGE_UI: ghcr.io/${{ github.repository_owner }}/trustless-commerce-ui

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package drift check
        run: |
          bash deploy/package.sh
          git diff --exit-code -- deploy/tctest/dist deploy/tcmain/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (api)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,prefix=main-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Docker meta (sweeper)
        id: meta_sweeper
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_SWEEPER }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,prefix=main-,format=short
            type=semver,pattern={{version}}

      - name: Build and push sweeper
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.sweeper
          push: true
          tags: ${{ steps.meta_sweeper.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Docker meta (ui)
        id: meta_ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_UI }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,prefix=main-,format=short
            type=semver,pattern={{version}}

      - name: Build and push UI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.ui
          push: true
          tags: ${{ steps.meta_ui.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Notify VPS (OIDC instant pull)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          for d in deploy/tctest/dist deploy/tcmain/dist; do
            python3 "$d/notify-vps-pull.py" --config "$d/packageconfig.yaml" --image "${{ env.IMAGE_API }}" --tag main || true
            python3 "$d/notify-vps-pull.py" --config "$d/packageconfig.yaml" --image "${{ env.IMAGE_UI }}" --tag main || true
            python3 "$d/notify-vps-pull.py" --config "$d/packageconfig.yaml" --image "${{ env.IMAGE_SWEEPER }}" --tag main || true
          done

      - name: Local compose smoke
        run: |
          chmod +x deploy/smoke-test.sh
          docker compose -f deploy/docker-compose.yml build
          docker compose -f deploy/docker-compose.yml up -d
          sleep 8
          ./deploy/smoke-test.sh
          docker compose -f deploy/docker-compose.yml down -v

      # Exercise the images that were just pushed (latest :main on default branch).
      - name: System tests against published images
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: main
          PULL: "1"
        run: |
          chmod +x system-tests/scripts/*.sh system-tests/tests/*.sh
          cp system-tests/.env.example system-tests/.env
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" system-tests/.env
          npm run system-test
