name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/trustless-commerce-api
  IMAGE_SWEEPER: ghcr.io/${{ github.repository_owner }}/trustless-commerce-sweeper

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (api)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Docker meta (sweeper)
        id: meta_sweeper
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_SWEEPER }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short
            type=semver,pattern={{version}}

      - name: Build and push sweeper
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.sweeper
          push: true
          tags: ${{ steps.meta_sweeper.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Local compose smoke
        run: |
          chmod +x deploy/gen-dev-certs.sh deploy/smoke-test.sh
          ./deploy/gen-dev-certs.sh
          docker compose -f deploy/docker-compose.yml build
          docker compose -f deploy/docker-compose.yml up -d
          sleep 8
          ./deploy/smoke-test.sh
          docker compose -f deploy/docker-compose.yml down -v
