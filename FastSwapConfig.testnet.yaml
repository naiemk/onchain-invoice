# FastSwap testnet — Sepolia + BSC testnet + TRON Nile.
# Bootstrap: copy .env.testnet.example → .env, fund wallet, then run CLI steps in order.
version: 1

active-chains:
  - sepolia
  - bscTestnet
  - tron

server:
  host: 127.0.0.1
  apiPort: 4010
  publicUrl: http://127.0.0.1:4010
  sqlitePath: ./data/fastswap-testnet.sqlite
  auditLogPath: ./data/api-audit-testnet.jsonl
  signingSecretEnv: API_SIGNING_SECRET
  captcha:
    provider: cloudflare-turnstile
    siteKey: ""
    secretKey: ""
    requireForQuotes: false
    requireForInvoices: false

quote:
  feeBps: 30
  maxDeviationBps: 500
  quoteTtlSec: 900
  packsUsd:
    - "0.10"
    - "0.25"
    - "1"

sweepNode:
  pollIntervalMs: 15000
  pageLimit: 500
  confirmations: 1
  logScanOverlap: 50
  sqlitePath: "./data/sweep-testnet.sqlite"

relayNode:
  pollIntervalMs: 5000
  confirmations: 1

liquidityMonitor:
  pollIntervalMs: 15000

deploy:
  createx: "0xba5Ed099633D3B313e4D5F7bdc1305d3c28ba5Ed"
  owner: "${FASTSWAP_OWNER_ADDRESS}"
  salts:
    namespace: fastswap-testnet
    version: "1"
  contracts:
    fastSwapImplementation: ""
    fastSwapAddress: ""
    sweeperAddress: ""
    forwarderImplementation: ""
    liquidityManagerImplementation: ""
    liquidityManagerAddress: ""

liquidityManager:
  pollIntervalMs: 60000
  sqlitePath: "./data/liquidity-manager-testnet.sqlite"
  economics:
    gasGateBps: 10
    minNotionalUsd: 0.05
    maxStalenessSec: 300
    riskCapUsd: 50
    cooldownSec: 60
    slippageBps: 100
    maxGasPriceGwei: 200

nodes:
  sweep:
    auditLogPath: ./data/sweep-audit-testnet.jsonl
  relay:
    progressPath: ./data/relay-progress-testnet.json
    auditLogPath: ./data/relay-audit-testnet.jsonl
  liqman:
    auditLogPath: ./data/liqman-audit-testnet.jsonl

chains:
  - key: sepolia
    id: "11155111"
    type: evm
    name: Sepolia
    optional: false
    rpcUrl: "${SEPOLIA_RPC_URL}"
    explorerUrl: https://sepolia.etherscan.io
    confirmations: 1
    startBlock: 0
    aggregatorSlug: eth
    nativeSentinel: "0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE"
    router: "${SEPOLIA_ROUTER_ADDRESS}"
    tokens:
      ETH:
        decimals: 18
        isNative: true
        minLiquidity: "0"
        priceSources:
          - type: static
            priceUsd: "3000"
      USDT:
        decimals: 6
        minLiquidity: "0"
        priceUsd: "1"
        priceSources:
          - type: static
            priceUsd: "1"
    liquidity:
      reserveStable: USDT
      receivers:
        - tokens:
            ETH:
              floor: "0.001"
              target: "0.003"
              ceiling: "0.01"
            USDT:
              isStable: true
              floor: "1"
              target: "5"
              ceiling: "20"

  - key: bscTestnet
    id: "97"
    type: evm
    name: BSC Testnet
    optional: false
    rpcUrl: "${BSC_TESTNET_RPC_URL}"
    explorerUrl: https://testnet.bscscan.com
    confirmations: 1
    startBlock: 0
    aggregatorSlug: bsc
    nativeSentinel: "0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE"
    router: "${BSC_TESTNET_ROUTER_ADDRESS}"
    tokens:
      BNB:
        decimals: 18
        isNative: true
        minLiquidity: "0"
        priceSources:
          - type: static
            priceUsd: "600"
      USDT:
        decimals: 6
        minLiquidity: "0"
        priceUsd: "1"
        priceSources:
          - type: static
            priceUsd: "1"
    liquidity:
      reserveStable: USDT
      receivers:
        - tokens:
            BNB:
              floor: "0.002"
              target: "0.005"
              ceiling: "0.02"
            USDT:
              isStable: true
              floor: "1"
              target: "5"
              ceiling: "20"

  - key: tron
    id: "3448148188"
    type: tron
    name: TRON Nile
    optional: false
    fullHost: "${NILE_FULL_HOST}"
    feeLimit: "150"
    explorerUrl: https://nile.tronscan.org
    startTimestamp: 0
    aggregatorSlug: tron
    router: "${TRON_ROUTER_ADDRESS}"
    contracts:
      fastSwapAddress: ""
      sweeperAddress: ""
      forwarderImplementation: ""
      liquidityManagerAddress: ""
    tokens:
      TRX:
        decimals: 6
        isNative: true
        minLiquidity: "0"
        priceSources:
          - type: static
            priceUsd: "0.30"
      USDT:
        decimals: 6
        minLiquidity: "0"
        priceUsd: "1"
        priceSources:
          - type: static
            priceUsd: "1"
    liquidity:
      reserveStable: USDT
      receivers:
        - tokens:
            TRX:
              floor: "50"
              target: "200"
              ceiling: "500"
            USDT:
              isStable: true
              floor: "1"
              target: "5"
              ceiling: "20"
